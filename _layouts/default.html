<!DOCTYPE html>
<html lang="en-AU">
{% include head.html %}
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="mark" href="{{ "/" | prepend: site.baseurl }}" aria-label="{{ site.title }}, home"><span aria-hidden="true">TW</span></a>
      <nav aria-label="Sections">
        <ul class="links">
          <li><a href="{{ "/#projects" | prepend: site.baseurl }}">Projects</a></li>
          <li><a href="{{ "/#how-i-work" | prepend: site.baseurl }}">How I work</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {{ content }}
  </main>
  <footer class="wrap site-footer">
    <p>{{ site.title }}</p>
    {% include links.html %}
  </footer>
</body>
</html>
